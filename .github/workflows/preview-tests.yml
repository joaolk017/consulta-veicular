name: Validar prévia isolada
on:
  push:
    branches:
      - dev/transformacao-profissional-360
    paths:
      - 'dev-preview/**'
      - 'scripts/audit-route-contracts.js'
      - 'server.js'
      - 'index.html'
      - 'scripts/check-real-ui.js'
      - 'scripts/check-commercial-claims.js'
      - 'scripts/check-institutional-pages.js'
      - 'scripts/check-pix-checkout.js'
      - 'scripts/check-pix-webhook.js'
      - 'scripts/check-payment-products.js'
      - 'scripts/check-wallet-idempotency.js'
      - 'contato.html'
      - 'termos.html'
      - 'privacidade.html'
      - 'reembolso.html'
      - '.github/workflows/preview-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'dev-preview/**'
      - 'scripts/**'
      - 'server.js'
      - 'index.html'
      - 'contato.html'
      - 'termos.html'
      - 'privacidade.html'
      - 'reembolso.html'
      - '.github/workflows/preview-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auditar contratos do servidor sem iniciar produção
        run: node scripts/audit-route-contracts.js
      - name: Verificar interface real sem executar integrações
        run: node scripts/check-real-ui.js
      - name: Conferir preço e comunicação comercial
        run: node scripts/check-commercial-claims.js
      - name: Validar páginas institucionais
        run: node scripts/check-institutional-pages.js
      - name: Verificar contrato do checkout Pix sem cobrar
        run: node scripts/check-pix-checkout.js
      - name: Verificar proteções do webhook Pix
        run: node scripts/check-pix-webhook.js
      - name: Comparar produtos e preços da simulação com produção
        run: node scripts/check-payment-products.js
      - name: Verificar transação e idempotência de créditos
        run: node scripts/check-wallet-idempotency.js
      - name: Testar prévia e ciclo fictício de compra
        run: node --test dev-preview/preview.test.js dev-preview/payment-flow.test.js
      - name: Testar acesso HTTP à prévia pública do Render
        run: node scripts/smoke-preview-http.js
