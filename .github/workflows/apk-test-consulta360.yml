name: Gerar APK Consulta Veicular 360
on:
  push:
    branches: ["android/apk-test-consulta360"]
    paths:
      - "apk-test/**"
      - ".github/workflows/apk-test-consulta360.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: apk-test
        run: gradle --no-daemon assembleDebug
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: ConsultaVeicular360-APK-TESTE
          path: apk-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
