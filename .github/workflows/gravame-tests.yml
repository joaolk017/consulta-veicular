name: Testes Gravame Detalhado
on:
  push:
    branches: [feature/gravame-detalhado]
  pull_request:
    paths:
      - gravame-detalhado.js
      - gravame-checkout.js
      - gravame.html
      - test/gravame-detalhado.test.js
      - .github/workflows/gravame-tests.yml
jobs:
  gravame:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe
        run: |
          node --check gravame-detalhado.js
          node --check gravame-checkout.js
          node --check server.js
      - name: Validar ordem das rotas
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('server.js', 'utf8');
          const checkout = source.indexOf('installGravameCheckout({');
          const fallback = source.indexOf('const notFound = path.join(__dirname, "404.html")');
          if (checkout < 0 || fallback < 0 || checkout > fallback) {
            throw new Error('Rotas de gravame devem ser registradas antes do middleware 404');
          }
          NODE
      - name: Testes sem chamadas externas
        env:
          GRAVAME_DETALHADO_ENABLED: '0'
        run: node --test test/gravame-detalhado.test.js
