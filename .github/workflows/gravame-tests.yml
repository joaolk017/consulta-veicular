name: Testes Gravame Detalhado
on:
  push:
    branches: [feature/gravame-detalhado]
  pull_request:
    paths:
      - gravame-detalhado.js
      - gravame-checkout.js
      - gravame.html
      - test/gravame-detalhado.test.js
      - test/gravame-checkout.test.js
      - .github/workflows/gravame-tests.yml
jobs:
  gravame:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe
        run: |
          node --check gravame-detalhado.js
          node --check gravame-checkout.js
          node --check server.js
      - name: Validar JavaScript e recuperação da página de pagamento
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('gravame.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)];
          if (scripts.length !== 1) throw new Error('Esperado um script na página gravame');
          new vm.Script(scripts[0][1], {filename:'gravame.html'});
          for (const marker of ['cv360-gravame-pagamento','cv_credit_account','d.status==="completed"','d.status==="review"']) {
            if (!html.includes(marker)) throw new Error('Recuperação ausente: '+marker);
          }
          NODE
      - name: Validar ordem das rotas
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('server.js', 'utf8');
          const checkout = source.indexOf('installGravameCheckout({');
          const fallback = source.indexOf('const notFound = path.join(__dirname, "404.html")');
          const gatedRoutes = source.includes('app.get(["/gravame", "/gravame.html", "/gravame/"]');
          if (checkout < 0 || fallback < 0 || checkout > fallback || !gatedRoutes) {
            throw new Error('Rotas de gravame devem ser registradas antes do middleware 404');
          }
          NODE
      - name: Testes sem chamadas externas
        env:
          GRAVAME_DETALHADO_ENABLED: '0'
        run: node --test test/gravame-detalhado.test.js test/gravame-checkout.test.js
