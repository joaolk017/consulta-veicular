name: Offline API integration tests
on:
  push:
    paths:
      - 'apifull-integration.js'
      - 'vehicle-provider-plan.js'
      - 'tests/**'
      - '.github/workflows/offline-api-tests.yml'
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate JavaScript syntax
        run: |
          node --check apifull-integration.js
          node --check vehicle-provider-plan.js
          node --check tests/apifull-offline-integration.test.js
      - name: Test API Full and FonteData without network or credentials
        run: node --test tests/apifull-offline-integration.test.js
