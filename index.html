<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consulta Veicular</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#080b10;color:#fff}.wrap{max-width:760px;margin:auto;padding:24px}
.card{background:#111722;border:1px solid #2a3444;border-radius:16px;padding:28px;margin-top:35px}
h1{font-size:42px;margin:0 0 12px}p{color:#b8c0cc;line-height:1.5}.red{color:#e63946}
input{width:100%;padding:16px;box-sizing:border-box;background:#090e15;border:1px solid #354052;border-radius:10px;color:#fff;font-size:20px;text-transform:uppercase;margin:15px 0}
button{width:100%;padding:16px;border:0;border-radius:10px;background:#e63946;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}.hidden{display:none}.result{margin-top:20px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #273142;padding:13px 0;gap:20px}.label{color:#9da8b8}.value{font-weight:bold;text-align:right}.error{background:#3a171b;border:1px solid #7d3038;padding:14px;border-radius:10px;color:#ffb3b8}
small{color:#818c9d}
</style></head>
<body>
<div class="wrap">
<div class="card">
<h1>Consulte a placa <span class="red">antes de fechar negócio.</span></h1>
<p>Digite a placa para consultar os dados disponíveis na base integrada.</p>
<input id="plate" maxlength="8" placeholder="ABC1D23">
<button id="btn" onclick="consultar()">CONSULTAR VEÍCULO</button>
<div id="status"></div>
<div id="result" class="result hidden"></div>
<p><small>As informações dependem da disponibilidade e atualização da fonte de dados. Esta página é um modelo de integração e não substitui consultas oficiais.</small></p>
</div>
</div>
<script>
function normalizar(p){return p.toUpperCase().replace(/[^A-Z0-9]/g,'')}
async function consultar(){
 const plate=normalizar(document.getElementById('plate').value), btn=document.getElementById('btn');
 const status=document.getElementById('status'), result=document.getElementById('result');
 if(!/^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(plate) && !/^[A-Z]{3}[0-9]{4}$/.test(plate)){
   status.innerHTML='<div class="error">Digite uma placa válida, como ABC1D23.</div>'; return;
 }
 btn.disabled=true; status.innerHTML='<p>Consultando...</p>'; result.classList.add('hidden');
 try{
   const r=await fetch('/api/consulta/'+encodeURIComponent(plate));
   const data=await r.json();
   if(!r.ok) throw new Error(data.error||'Não foi possível realizar a consulta.');
   const v=data.vehicle||data.data||data;
   const fields=[
    ['Placa',v.plate||v.placa],['Marca',v.brand||v.marca],['Modelo',v.model||v.modelo],
    ['Ano',v.year||v.ano],['Ano-modelo',v.modelYear||v.ano_modelo||v.anoModelo],
    ['Cor',v.color||v.cor],['Município',v.city||v.municipio],['UF',v.state||v.uf],
    ['Combustível',v.fuel||v.combustivel],['Tipo',v.type||v.tipo]
   ];
   result.innerHTML='<h2>Resultado da consulta</h2>'+fields.filter(x=>x[1]!==undefined&&x[1]!==null&&x[1]!=='')
   .map(x=>`<div class="row"><span class="label">${x[0]}</span><span class="value">${String(x[1])}</span></div>`).join('');
   result.classList.remove('hidden'); status.innerHTML='';
 }catch(e){status.innerHTML='<div class="error">'+e.message+'</div>'}
 finally{btn.disabled=false}
}
</script>
</body></html>
