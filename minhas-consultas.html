<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minhas Consultas | Consulta Veicular 360</title><meta name="robots" content="noindex,nofollow">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#142033;font-family:Arial,Helvetica,sans-serif}.top{background:#0b172a;color:#fff;padding:18px 16px}.topin,.wrap{max-width:980px;margin:auto}.brand{font-size:23px;font-weight:900}.brand span{color:#f6c445}.back{float:right;color:#fff;text-decoration:none;font-weight:700;margin-top:4px}.wrap{padding:26px 16px 50px}.hero,.card{background:#fff;border:1px solid #dce5ed;border-radius:16px;box-shadow:0 8px 28px rgba(11,23,42,.06)}.hero{padding:24px;display:flex;justify-content:space-between;gap:18px;align-items:center}.hero h1{margin:0 0 7px;font-size:27px}.muted{color:#64748b;line-height:1.5}.balance{min-width:180px;text-align:center;background:#f8fafc;border-radius:14px;padding:16px}.balance strong{display:block;font-size:34px;color:#0b172a}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.btn{border:0;border-radius:10px;padding:13px 17px;font-weight:800;cursor:pointer;text-decoration:none;font-size:14px}.primary{background:#0b172a;color:#fff}.secondary{background:#fff;color:#0b172a;border:1px solid #b9c8d6}.card{padding:20px;margin-top:18px}.card h2{margin:0 0 14px}.item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:16px 0;border-top:1px solid #e8eef3}.item:first-of-type{border-top:0}.plate{font-size:20px;font-weight:900}.status{display:inline-block;margin-left:8px;font-size:11px;padding:5px 8px;border-radius:20px;background:#e9f8ef;color:#176b3a;font-weight:800}.failed{background:#fff0f0;color:#a52828}.pending{background:#fff8e6;color:#785b00}.empty,.info,.error{padding:16px;border-radius:10px;background:#f8fafc}.error{background:#fff0f0;color:#8c2020}.overlay{position:fixed;inset:0;background:rgba(3,10,20,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.hidden{display:none!important}.modal{background:#fff;border-radius:16px;width:min(680px,100%);max-height:90vh;overflow:auto;padding:22px}.close{float:right;border:0;background:#eef2f6;border-radius:8px;padding:8px 11px;cursor:pointer}.row{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid #edf1f5}.row span:last-child{text-align:right;font-weight:700}.recover{margin-top:8px}.recover input{width:100%;padding:13px;border:1px solid #b9c8d6;border-radius:9px;margin:7px 0}.code{font-size:22px;letter-spacing:5px;text-align:center}@media(max-width:620px){.hero{display:block}.balance{margin-top:16px}.item{grid-template-columns:1fr}.item .btn{width:100%}.back{font-size:13px}.row{display:block}.row span{display:block}.row span:last-child{text-align:left;margin-top:4px}}
@media print{.top,.actions,.close,.noprint{display:none!important}body{background:#fff}.modal{max-height:none;width:100%;padding:0}.overlay{position:static;background:#fff;padding:0}.card,.hero{box-shadow:none;border:0}}
</style></head><body>
<header class="top"><div class="topin"><a class="back" href="/">← Voltar ao site</a><div class="brand">Consulta Veicular <span>360</span></div></div></header>
<main class="wrap"><section class="hero"><div><h1>Minhas Consultas</h1><div class="muted">Acompanhe seus créditos e reabra os relatórios das consultas realizadas nesta conta.</div><div id="accountEmail" class="muted" style="margin-top:5px"></div></div><div class="balance"><span class="muted">Créditos disponíveis</span><strong id="balance">—</strong><span class="muted">consultas</span></div></section>
<div class="actions"><button class="btn primary" onclick="location.href='/'">+ NOVA CONSULTA</button><button class="btn secondary" onclick="load()">↻ ATUALIZAR</button><button class="btn secondary" onclick="openRecovery()">RECUPERAR POR E-MAIL</button></div>
<div id="msg"></div><section class="card"><h2>Histórico</h2><div id="history"><div class="empty">Carregando suas consultas...</div></div></section></main>
<div id="reportModal" class="overlay hidden"><div class="modal"><button class="close noprint" onclick="closeReport()">✕</button><div id="report"></div></div></div>
<div id="recoveryModal" class="overlay hidden"><div class="modal"><button class="close" onclick="closeRecovery()">✕</button><h2>Recuperar acesso</h2><p class="muted">Enviaremos um código de 6 números se o e-mail estiver cadastrado.</p><div id="stepEmail" class="recover"><label><b>E-mail</b></label><input id="email" type="email" autocomplete="email" placeholder="seuemail@exemplo.com"><button class="btn primary" onclick="sendCode()">ENVIAR CÓDIGO</button></div><div id="stepCode" class="recover hidden"><label><b>Código de recuperação</b></label><input id="code" class="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"><button class="btn primary" onclick="verifyCode()">CONFIRMAR CÓDIGO</button></div><div id="recoveryMsg" style="margin-top:12px"></div></div></div>
<script>
const key='cv_credit_account',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=d=>d?new Date(d).toLocaleString('pt-BR'):'—';
function token(){return localStorage.getItem(key)||''}function badge(s){return s==='completed'?'<span class="status">CONCLUÍDA</span>':s==='failed'?'<span class="status failed">FALHOU · CRÉDITO ESTORNADO</span>':'<span class="status pending">PROCESSANDO</span>'}
async function load(){document.getElementById('msg').innerHTML='';if(!token()){document.getElementById('balance').textContent='0';document.getElementById('history').innerHTML='<div class="empty">Nenhuma conta encontrada neste aparelho. Use <b>Recuperar por e-mail</b> para restaurar seus créditos e histórico.</div>';return}try{const r=await fetch('/api/minhas-consultas',{headers:{'X-Credit-Account':token()},cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.mensagem||'Não foi possível carregar sua conta.');document.getElementById('balance').textContent=d.creditos??0;document.getElementById('accountEmail').textContent=d.email?'Conta vinculada: '+d.email:'';const list=d.consultas||[];document.getElementById('history').innerHTML=list.length?list.map(q=>'<div class="item"><div><div><span class="plate">'+esc(q.plate)+'</span>'+badge(q.status)+'</div><div class="muted" style="margin-top:6px">Realizada em '+esc(fmt(q.created_at))+'</div></div><div>'+(q.status==='completed'&&q.relatorio_disponivel?'<button class="btn secondary" onclick="report(\''+esc(q.id)+'\')">VER RELATÓRIO</button>':'')+'</div></div>').join(''):'<div class="empty">Você ainda não realizou consultas nesta conta.</div>'}catch(e){document.getElementById('msg').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function row(l,v){return '<div class="row"><span>'+esc(l)+'</span><span>'+esc(v||'Não informado')+'</span></div>'}
function ind(l,v){return row(l,v===true?'Ocorrência indicada':v===false?'Nada consta na indicação':'Não informado')}
async function report(id){try{const r=await fetch('/api/minhas-consultas/'+encodeURIComponent(id),{headers:{'X-Credit-Account':token()},cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.mensagem||'Relatório indisponível.');const v=d.vehicle||{};let h='<h2>Relatório da placa '+esc(v.plate||d.consulta.plate)+'</h2><p class="muted">Consulta concluída em '+esc(fmt(d.consulta.completed_at))+'</p>'+row('Marca',v.brand)+row('Modelo',v.model)+row('Ano / Ano-modelo',v.modelYear&&v.year&&String(v.modelYear)!==String(v.year)?v.year+' / '+v.modelYear:v.modelYear||v.year)+row('Cor',v.color)+row('Município / UF',[v.city,v.state].filter(Boolean).join(' / '))+row('Combustível',v.fuel)+row('Tipo do veículo',v.type);if(v.renavam)h+=row('RENAVAM',v.renavam);if(v.chassis)h+=row('Chassi',v.chassis);if(v.status)h+=row('Situação',v.status);if(v.fipe&&(v.fipe.value||v.fipe.numericValue)){h+='<h3>Referência FIPE</h3>'+row('Valor',v.fipe.value||(Number(v.fipe.numericValue)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}));if(v.fipe.code)h+=row('Código FIPE',v.fipe.code)}if(v.indicators){const i=v.indicators;h+='<h3>Indicadores disponíveis</h3>'+ind('Roubo / furto',i.theft)+ind('Leilão',i.auction)+ind('Recall',i.recall)+ind('RENAJUD',i.renajud)+ind('Infrações',i.renainf)+ind('Remarcação de chassi',i.chassisRemarked)}if(Array.isArray(v.restrictions)){h+='<h3>Restrições retornadas</h3>'+(v.restrictions.length?v.restrictions.map((x,i)=>row('Restrição '+(i+1),x)).join(''):row('Restrições','Nenhuma restrição informada'))}h+='<p class="muted">Os campos exibidos são somente os efetivamente retornados pelas fontes integradas.</p><div class="actions noprint"><button class="btn primary" onclick="window.print()">SALVAR / IMPRIMIR PDF</button></div>';document.getElementById('report').innerHTML=h;document.getElementById('reportModal').classList.remove('hidden')}catch(e){document.getElementById('msg').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function closeReport(){document.getElementById('reportModal').classList.add('hidden')}function openRecovery(){document.getElementById('recoveryModal').classList.remove('hidden');document.getElementById('stepEmail').classList.remove('hidden');document.getElementById('stepCode').classList.add('hidden');document.getElementById('recoveryMsg').innerHTML=''}function closeRecovery(){document.getElementById('recoveryModal').classList.add('hidden')}
async function sendCode(){const email=document.getElementById('email').value.trim();if(!email.includes('@'))return document.getElementById('recoveryMsg').innerHTML='<div class="error">Informe um e-mail válido.</div>';try{const r=await fetch('/api/creditos/recuperar/solicitar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})}),d=await r.json();if(!r.ok)throw new Error(d.mensagem||'Falha ao enviar código.');document.getElementById('stepEmail').classList.add('hidden');document.getElementById('stepCode').classList.remove('hidden');document.getElementById('recoveryMsg').innerHTML='<div class="info">Digite o código enviado ao seu e-mail.</div>';document.getElementById('code').focus()}catch(e){document.getElementById('recoveryMsg').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function verifyCode(){const email=document.getElementById('email').value.trim(),codigo=document.getElementById('code').value.replace(/\D/g,'').slice(0,6);try{const r=await fetch('/api/creditos/recuperar/confirmar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,codigo})}),d=await r.json();if(!r.ok)throw new Error(d.mensagem||'Código inválido.');localStorage.setItem(key,d.accountToken);closeRecovery();await load();document.getElementById('msg').innerHTML='<div class="info">Acesso recuperado com segurança neste aparelho.</div>'}catch(e){document.getElementById('recoveryMsg').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
document.getElementById('code').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,6));load();
</script></body></html>
