<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel do Funil | Consulta Veicular 360</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f7fa;color:#102536}.wrap{max-width:980px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.card{background:#fff;border:1px solid #dce6ed;border-radius:16px;padding:18px;margin-top:14px;box-shadow:0 5px 18px #0b26340d}.login{max-width:520px;margin:60px auto}.row{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #bdcbd5}input{flex:1;min-width:220px}button{background:#102f46;color:#fff;font-weight:800;cursor:pointer}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#f7fafc;border-radius:12px;padding:14px}.metric small{display:block;color:#617482}.metric b{font-size:25px}.metric.highlight{background:#eef7fb;border:1px solid #d5e7f0}.metric.warn{background:#fff8eb;border:1px solid #f1dfb8}.bar{height:9px;background:#e5edf2;border-radius:10px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:#173e59}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #e5edf2;font-size:14px}.muted{color:#617482;font-size:13px}.error{color:#a61b1b;margin-top:10px}@media(max-width:620px){.wrap{padding:14px}.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.table{font-size:12px}.table th,.table td{padding:8px 4px}}</style></head><body>
<div id="login" class="wrap login"><div class="card"><h2>Painel administrativo</h2><p class="muted">Informe a chave administrativa configurada no servidor.</p><div class="row"><input id="secret" type="password" autocomplete="current-password" placeholder="Chave administrativa"><button onclick="entrar()">ENTRAR</button></div><div id="err" class="error"></div></div></div>
<div id="panel" class="wrap hidden"><div class="top"><div><h1 style="margin:0">Funil de conversão</h1><div class="muted">Consulta Veicular 360</div></div><div class="row"><select id="days" onchange="load()"><option value="1">Hoje / 24h</option><option value="7" selected>7 dias</option><option value="30">30 dias</option><option value="90">90 dias</option></select><button onclick="sair()">SAIR</button></div></div><div id="metrics" class="grid"></div><div class="card"><h3>Conversão entre etapas</h3><div id="conversion"></div></div><div class="card"><h3>Desempenho por pacote</h3><div style="overflow:auto"><table class="table"><thead><tr><th>Pacote</th><th>Selecionado</th><th>PIX gerado</th><th>PIX pago</th><th>Relatório</th></tr></thead><tbody id="products"></tbody></table></div></div><div class="card"><h3>Eventos por dia</h3><div style="overflow:auto"><table class="table"><thead><tr><th>Data</th><th>Consultas</th><th>Prévias</th><th>PIX</th><th>Pagos</th><th>Relatórios</th></tr></thead><tbody id="daily"></tbody></table></div></div></div>
<script>
const names=['consulta_iniciada','previa_exibida','pacote_selecionado','pix_gerado','pix_pago','relatorio_entregue'],labels=['Consultas iniciadas','Prévias exibidas','Pacotes selecionados','PIX gerados','PIX pagos','Relatórios entregues'];let key='';
function entrar(){key=document.getElementById('secret').value.trim();if(!key)return;load()}
function sair(){key='';document.getElementById('secret').value='';document.getElementById('panel').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
async function load(){try{const d=Number(document.getElementById('days')?.value||7),r=await fetch('/api/admin/funil?days='+d,{headers:{'X-Admin-Secret':key},cache:'no-store'});if(!r.ok)throw new Error('Chave inválida ou painel indisponível.');const x=await r.json();document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');render(x)}catch(e){document.getElementById('err').textContent=e.message}}
function render(x){const map=Object.fromEntries(x.totals.map(a=>[a.event_name,Number(a.total)]));const prices={'consulta-completa':18.90,'pacote-2':32.90,'pacote-3':44.90,'upsell-2':24.90};const ps={};x.products.forEach(a=>{ps[a.product]??={};ps[a.product][a.event_name]=Number(a.total)});const iniciadas=map.consulta_iniciada||0,pixGerados=map.pix_gerado||0,pixPagos=map.pix_pago||0,relatorios=map.relatorio_entregue||0;const conversaoGeral=iniciadas?(pixPagos/iniciadas*100):0;const abandonoPix=pixGerados?Math.max(0,(pixGerados-pixPagos)/pixGerados*100):0;let faturamento=0;Object.entries(ps).forEach(([p,v])=>{faturamento+=(v.pix_pago||0)*(prices[p]||0)});const ticketMedio=pixPagos?faturamento/pixPagos:0;const money=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const extras=[['Conversão geral',conversaoGeral.toFixed(1)+'%','highlight'],['Faturamento',money(faturamento),'highlight'],['Ticket médio',money(ticketMedio),'highlight'],['Abandono no PIX',abandonoPix.toFixed(1)+'%','warn']];document.getElementById('metrics').innerHTML=names.map((n,i)=>'<div class="metric"><small>'+labels[i]+'</small><b>'+(map[n]||0)+'</b></div>').join('')+extras.map(a=>'<div class="metric '+a[2]+'"><small>'+a[0]+'</small><b>'+a[1]+'</b></div>').join('');let h='';for(let i=1;i<names.length;i++){const a=map[names[i-1]]||0,b=map[names[i]]||0,p=a?Math.min(100,b/a*100):0;h+='<div style="margin:12px 0"><b>'+labels[i-1]+' → '+labels[i]+'</b><span style="float:right">'+p.toFixed(1)+'%</span><div class="bar"><i style="width:'+p+'%"></i></div></div>'}document.getElementById('conversion').innerHTML=h;document.getElementById('products').innerHTML=Object.entries(ps).map(([p,v])=>'<tr><td>'+p+'</td><td>'+(v.pacote_selecionado||0)+'</td><td>'+(v.pix_gerado||0)+'</td><td>'+(v.pix_pago||0)+'</td><td>'+(v.relatorio_entregue||0)+'</td></tr>').join('')||'<tr><td colspan="5">Sem dados ainda.</td></tr>';const ds={};x.daily.forEach(a=>{ds[a.day]??={};ds[a.day][a.event_name]=Number(a.total)});document.getElementById('daily').innerHTML=Object.entries(ds).reverse().map(([d,v])=>'<tr><td>'+d+'</td><td>'+(v.consulta_iniciada||0)+'</td><td>'+(v.previa_exibida||0)+'</td><td>'+(v.pix_gerado||0)+'</td><td>'+(v.pix_pago||0)+'</td><td>'+(v.relatorio_entregue||0)+'</td></tr>').join('')||'<tr><td colspan="6">Sem dados ainda.</td></tr>'}
</script></body></html>
